unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "~/.config/tmux/tmux.conf reloaded!"

unbind q
bind q kill-session

set -g prefix C-s
set -g mouse on
set -g default-terminal "tmux-256color"
# set -g default-terminal "${TERM}"
# set -sg terminal-overrides ",*:RGB"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top
set-option -g update-environment "TERM_PROGRAM"

# List of plugins
set -g @plugin 'vndmp4/tmux-fzf-session-switch'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.3'
# set -g @plugin 'tmux-plugins/tmux-cpu'
# set -g @plugin 'tmux-plugins/tmux-battery'
# set -g @plugin 'tmux-plugins/tpm'

# Configure tmux-fzf-session-switch plugin
set -g @fzf-goto-session 's'
set -g @fzf-goto-preview-enabled 'true'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
run ~/.config/tmux/plugins/tmux/catppuccin.tmux
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
# set -agF status-right "#{E:@catppuccin_status_battery}"

# after all configs, run <prefix> shift+I to install plugins and reload environment

# if needs to uninstall plugins, remove from this file, save and run <prefix> alt+u
# obs.: remember to kill all sessions after that.

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
